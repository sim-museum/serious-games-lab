  A('impTable',()=>{
    let rows='';for(let i=0;i<IMP_TABLE.length;i++){const lo=i===0?0:IMP_TABLE[i-1][0];const [hi,imp]=IMP_TABLE[i];
      rows+=`<tr><td>${lo}–${hi===Infinity?'∞':hi-1}</td><td>${imp}</td></tr>`;}
    info('IMP Conversion Table','<table class="grid"><tr><th>Point difference</th><th>IMPs</th></tr>'+rows+'</table>',360);
  });
  A('probTable',()=>{
    let rows='';for(const m in SUIT_SPLITS){for(const [a,b,p] of SUIT_SPLITS[m])rows+=`<tr><td>${m}</td><td>${a}-${b}</td><td>${p}%</td></tr>`;}
    info('Probabilities Table','<p class="hint">A priori suit-split probabilities.</p><table class="grid"><tr><th>Missing</th><th>Split</th><th>Prob</th></tr>'+rows+'</table>',380);
  });
  A('scoringRef',()=>{
    info('Scoring Reference',`<table class="grid">
      <tr><th>Item</th><th>Value</th></tr>
      <tr><td>Minor suit trick (♣♦)</td><td>20 each</td></tr>
      <tr><td>Major suit trick (♥♠)</td><td>30 each</td></tr>
      <tr><td>No-trump first / rest</td><td>40 / 30</td></tr>
      <tr><td>Part-score bonus</td><td>50</td></tr>
      <tr><td>Game (non-vul / vul)</td><td>300 / 500</td></tr>
      <tr><td>Small slam (nv / v)</td><td>500 / 750</td></tr>
      <tr><td>Grand slam (nv / v)</td><td>1000 / 1500</td></tr>
      <tr><td>Doubled / redoubled insult</td><td>50 / 100</td></tr>
      <tr><td>Undertrick (nv undoubled)</td><td>−50 each</td></tr>
      <tr><td>Undertrick (vul undoubled)</td><td>−100 each</td></tr>
    </table>`,420);
  });

  // -- modes --
  A('minibridge',()=>{
    const body=el('div');
    const modeSel=select([{value:'4player',label:'Standard Bridge'},{value:'minibridge',label:'MiniBridge (no auction)'},{value:'1player',label:'One-Player (no peek)'}],CONFIG.mode);
    body.appendChild(el('div',{class:'hint',style:'margin-bottom:8px',text:'MiniBridge skips the auction: each side announces its combined HCP, the stronger side picks the contract, then you play the cards. One-Player shows only your hand.'}));
    body.appendChild(frow('Mode',modeSel));
    const seatSel=select([N,E,So,W].map(s=>({value:s,label:SEAT_NAME[s]})),CONFIG.onePlayerSeat);
    body.appendChild(frow('One-player seat',seatSel));
    modal({title:'One-Player & MiniBridge Mode',body,width:480,footer:[{label:'Cancel'},{label:'Apply',primary:true,fn:(c)=>{
      CONFIG.mode=modeSel.value;CONFIG.onePlayerSeat=parseInt(seatSel.value);c();UI.renderStatus();persist();
      modal({title:'Start',body:'<p>Apply now and deal a new board?</p>',footer:[{label:'Later'},{label:'New Deal',primary:true,fn:(cc)=>{cc();Game.newBoard({});UI.loop();}}]});}}]});
  });
  A('rubberScoring',()=>{CONFIG.scoring='Rubber';UI.renderStatus();info('Rubber Scoring','<p>Scoring set to <b>Rubber</b>. Game bonus comes from crossing 100 below the line; rubber bonus is 700 (2-0) or 500 (2-1).</p>');});
  A('statistics',()=>{
    const st=Game.scoreTable;const made=st.filter(r=>r.tricks>=6+r.contract.level).length;
    info('Statistics',`<p>Boards played: <b>${st.length}</b></p><p>Contracts made: <b>${made}</b> / ${st.length}</p>`+
      `<p>N/S total: ${st.reduce((a,r)=>a+r.ns_score,0)} · E/W total: ${st.reduce((a,r)=>a+r.ew_score,0)}</p>`);
  });

  // -- network / desktop-only (informative) --
  const desktopOnly=(t)=>info(t,'<p>'+t+' is part of the desktop BridgeIQ (network play between machines / Q-Plus tournament protocol). It requires raw TCP sockets and a local engine binary, which a single-file browser app cannot provide.</p><p class="hint">Everything else — bidding, double-dummy play, scoring, analysis, teaching — runs fully in your browser with no server.</p>');
  A('startServer',()=>desktopOnly('Network Server'));
  A('connectServer',()=>desktopOnly('Connect to Server'));
  A('disconnect',()=>{});
  A('ingestQplus',()=>desktopOnly('Ingest Q-Plus Closed Room'));
  A('loadLin',()=>UI.doAction('openFile'));

  // -- help --
  A('help',()=>info('BridgeIQ Help',
    `<p><b>BridgeIQ</b> is a complete bridge program: deal, bid across five systems, play with a double-dummy engine, and score IMP / matchpoint / rubber.</p>
     <h4>Playing</h4>
     <ul><li><b>New Deal</b> (Ctrl+N) to start.</li>
     <li>During the auction, click a bid button or type: <span class="kbd">p</span> pass, <span class="kbd">x</span> double, level digit then suit letter (e.g. <span class="kbd">3</span><span class="kbd">n</span> = 3NT).</li>
     <li>During play, click a card in your hand. You must follow suit.</li>
     <li><b>Show All</b> (F2) reveals every hand. <b>Hint</b> asks the engine. <b>Claim</b> uses double-dummy to settle the rest.</li></ul>
     <h4>Teaching</h4>
     <p>Click any bid in the auction panel to see why it was chosen. The Explain panel narrates each card. View ▸ Interpret Auction walks the whole sequence.</p>`,560));
  A('programmingHelp',()=>info('Bridge for Programmers',
    `<table class="grid"><tr><th>Bridge</th><th>Programming analogy</th></tr>
     <tr><td>Bidding system</td><td>A protocol / state machine of conventions</td></tr>
     <tr><td>Double-dummy solver</td><td>Minimax + alpha-beta with a transposition table</td></tr>
     <tr><td>Monte-Carlo play</td><td>Sampling hidden state, evaluating each candidate</td></tr>
     <tr><td>Signals</td><td>A side-channel encoding (high/low = 1 bit) under a shared codec</td></tr>
     <tr><td>Pavlicek number</td><td>Combinatorial (factoradic-style) perfect hash of a deal</td></tr>
     </table>`,520));
  A('shortcuts',()=>info('Keyboard Shortcuts',
    `<table class="grid"><tr><th>Key</th><th>Action</th></tr>
     <tr><td>Ctrl+N</td><td>New deal</td></tr><tr><td>Ctrl+O / Ctrl+S</td><td>Open / Save</td></tr>
     <tr><td>F2</td><td>Show all hands</td></tr><tr><td>F5</td><td>Repeat deal</td></tr>
     <tr><td>Ctrl+I</td><td>Interpret auction</td></tr>
     <tr><td>p / x / X</td><td>Pass / Double / (Shift) Redouble</td></tr>
     <tr><td>1–7 then c d h s n</td><td>Make a bid</td></tr>
     <tr><td>Enter / Space</td><td>Next (after a trick)</td></tr></table>`,420));
  A('about',()=>info('About BridgeIQ',
    `<div style="text-align:center"><div style="font-size:28px;color:var(--gold);font-weight:800">Bridge<span style="color:#fff">IQ</span></div>
     <p>A complete browser port of the BridgeIQ desktop program.</p>
     <p class="hint">Five bidding systems · rule-based bidder · double-dummy + Monte-Carlo card play · IMP / MP / rubber scoring · teaching explainer · double-dummy analysis · PBN / LIN import-export.</p>
     <p class="hint">Single self-contained HTML file — no server, no dependencies.</p></div>`,480));

  // -- end of hand --
  A('endOfHand',()=>{
    const b=Game.board;if(!b||!b.result)return;
    const c=b.contract,r=b.result;
    const cs=c.level+(c.suit===NT?'NT':SUIT_SYM[c.suit])+(c.redoubled?'XX':c.doubled?'X':'');
    const res=r.made?(r.overUnder>0?'made +'+r.overUnder:'made exactly'):'down '+(-r.overUnder);
    const scoreLine=r.ns_score?`N/S +${r.ns_score}`:`E/W +${r.ew_score}`;
    UI.showPrompt(`${cs} by ${SEAT_NAME[c.declarer]} — ${res} (${scoreLine})`,
      [{label:'Review',fn:()=>UI.doAction('auctionTricks')},
       {label:'Score',fn:()=>UI.doAction('scoreTable')},
       {label:'Repeat',fn:()=>{UI.hidePrompt();UI.doAction('repeatDeal');}},
       {label:'Next Deal',primary:true,fn:()=>{UI.hidePrompt();UI.doAction('nextDeal');}}]);
    persist();
  });

  return {MENUS,modal,info,persist,bidCellMini};
})();

/* ============================ 12. BOOTSTRAP ============================ */
(function boot(){
  // restore config if present
  try{const cfg=localStorage.getItem('bridgeIQ-config');if(cfg)Object.assign(CONFIG,JSON.parse(cfg));}catch(e){}
  UI.buildMenubar(Dialogs.MENUS);
  UI.init();
  // first deal
  Game.newBoard({boardNumber:CONFIG.startBoard,seed:(Math.random()*1e9)|0});
  UI.loop();
  // persist on unload
  window.addEventListener('beforeunload',()=>{try{Dialogs.persist();}catch(e){}});
  // expose for console/debugging
  window.BIQ={Game,CONFIG,Bidding,Cardplay,DDS,UI,Dialogs,Pav};
})();

</script>
</body>
</html>
