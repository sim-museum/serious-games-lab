<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokerIQ — Texas Hold'em trainer</title>
<style>
/* PokerIQ — table styling. Dark felt, casino-ish but legible.
 * Sizing roughly 2× the first cut: the felt had too much dead space and the
 * fonts were hard to read. Base font 20px; cards, seats, HUD, advisor, buttons
 * all scaled up to fill the table. */
:root{
  --bg:#0c1117; --felt:#15543a; --felt2:#0f4030; --rail:#3a2a1a;
  --ink:#eef3f7; --muted:#9aa7b4; --line:#243; --gold:#d9b25b;
  --chip:#e6c04a; --pos:#3fb950; --neg:#f85149; --neu:#9aa7b4; --accent:#58a6ff;
  --card-red:#d23b3b; --card-dark:#1a1f29;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:radial-gradient(120% 100% at 50% -10%,#16202b,#0a0e13 70%);
  color:var(--ink);font:20px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
#app{max-width:1280px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.muted{color:var(--muted);} .pos{color:var(--pos);} .neg{color:var(--neg);} .neu{color:var(--neu);}
button{font:inherit;cursor:pointer;}

/* top bar */
.piq-top{display:flex;align-items:center;gap:22px;padding:14px 24px;border-bottom:1px solid var(--line);}
.piq-brand{font-size:30px;letter-spacing:.5px;} .piq-brand b{color:var(--gold);}
.piq-hud{display:flex;gap:24px;flex:1;font-variant-numeric:tabular-nums;font-size:20px;}
.piq-hud .muted{font-size:17px;}
.piq-menu{display:flex;gap:9px;}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-size:18px;}
.ghost.on{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:600;}

/* felt */
.piq-felt{position:relative;flex:1;margin:22px;border-radius:160px;
  background:radial-gradient(120% 120% at 50% 35%,var(--felt),var(--felt2));
  border:18px solid #20160c;box-shadow:inset 0 0 60px rgba(0,0,0,.55),0 12px 40px rgba(0,0,0,.5);
  min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;}
.piq-board{display:flex;gap:11px;min-height:92px;align-items:center;font-size:24px;}
.piq-pot{margin-top:16px;color:var(--gold);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums;}
.piq-pot .chip{display:inline-block;width:17px;height:17px;border-radius:50%;background:var(--chip);
  box-shadow:0 0 0 2px #b8941f, 2px 2px 3px rgba(0,0,0,.4);vertical-align:-1px;margin-right:6px;}

/* seats */
.piq-seats{position:absolute;inset:0;pointer-events:none;}
.seat{position:absolute;width:218px;padding:11px 14px;border-radius:13px;background:rgba(8,14,20,.85);
  border:1px solid var(--line);backdrop-filter:blur(2px);font-size:17px;pointer-events:auto;}
.seat .seat-head{display:flex;align-items:center;gap:7px;margin-bottom:7px;}
.seat-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;font-size:18px;}
.seat .pos{font-size:14px;color:#06121f;background:var(--muted);border-radius:4px;padding:1px 6px;font-weight:600;}
.seat .dealer{font-size:14px;font-weight:700;color:#06121f;background:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;}
.seat .lvl{font-size:14px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;margin-left:auto;}
.seat-cards{display:flex;gap:6px;margin-bottom:7px;}
.seat-foot{display:flex;gap:12px;align-items:center;font-size:17px;}
.seat .stack{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums;}
.seat .bet{color:var(--muted);} .seat .allin{color:var(--neg);font-weight:700;}
.seat .last{position:absolute;top:-12px;right:12px;font-size:14px;text-transform:uppercase;letter-spacing:.5px;
  color:#06121f;background:var(--gold);border-radius:5px;padding:2px 8px;font-weight:600;}
.seat.folded{opacity:.42;} .seat.turn{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 22px rgba(217,178,91,.45);}
.seat.hero{border-color:var(--accent);}
.seat .leak{margin-top:6px;color:#f0b34a;font-size:15px;line-height:1.3;}
.seat .range{margin-top:3px;color:var(--muted);font-size:14px;line-height:1.35;}
/* 6-max seat positions around the oval */
.seat:nth-child(1){left:50%;bottom:12px;transform:translateX(-50%);}      /* hero bottom */
.seat:nth-child(2){left:16px;bottom:130px;}
.seat:nth-child(3){left:16px;top:84px;}
.seat:nth-child(4){left:50%;top:12px;transform:translateX(-50%);}
.seat:nth-child(5){right:16px;top:84px;}
.seat:nth-child(6){right:16px;bottom:130px;}

/* cards */
.card{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  width:60px;height:84px;border-radius:8px;background:#f6f7f9;color:var(--card-dark);
  box-shadow:0 2px 5px rgba(0,0,0,.45);font-weight:700;line-height:1;border:1px solid #cfd6df;}
.card b{font-size:26px;} .card i{font-style:normal;font-size:23px;}
.card.heart,.card.diamond{color:var(--card-red);}
.card.back{background:repeating-linear-gradient(45deg,#7a1f1f,#7a1f1f 7px,#5e1414 7px,#5e1414 14px);border:1px solid #4a0f0f;}
.card.empty{background:transparent;border:1px dashed rgba(255,255,255,.18);box-shadow:none;}
.seat .card{width:48px;height:66px;} .seat .card b{font-size:20px;} .seat .card i{font-size:17px;}

/* result overlay */
.piq-result{position:absolute;inset:0;background:rgba(4,8,12,.8);display:flex;align-items:center;justify-content:center;border-radius:144px;z-index:5;}
.result-card{background:#121922;border:1px solid var(--line);border-radius:16px;padding:30px 38px;text-align:center;min-width:440px;}
.result-card h3{margin:0 0 10px;color:var(--muted);font-weight:500;font-size:18px;}
.result-net{font-size:38px;font-weight:700;margin-bottom:16px;}
.result-show{text-align:left;font-size:19px;margin-bottom:22px;}
.result-show .won{color:var(--gold);font-weight:600;}
.result-btns{display:flex;gap:12px;justify-content:center;}

/* bottom: feed + advisor + actions */
.piq-bottom{display:grid;grid-template-columns:1fr 1.5fr;gap:18px;padding:0 24px 24px;align-items:start;}
.piq-feed{grid-row:1/3;background:#0d141c;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  font-size:17px;color:var(--muted);height:210px;overflow:auto;}
.piq-feed div{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.piq-advisor{background:#0d141c;border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
.adv-row{display:grid;grid-template-columns:repeat(6,auto);gap:8px 18px;align-items:baseline;margin-bottom:11px;font-variant-numeric:tabular-nums;font-size:21px;}
.adv-k{color:var(--muted);font-size:15px;text-transform:uppercase;letter-spacing:.4px;}
.adv-v{font-weight:600;}
.adv-board{font-size:17px;color:var(--muted);margin-bottom:8px;}
.adv-verdict{color:var(--gold);font-weight:600;font-size:21px;}
.piq-actions{display:flex;flex-wrap:wrap;gap:11px;align-items:center;min-height:60px;}
.btn{border:0;border-radius:10px;padding:14px 26px;font-weight:600;font-size:20px;color:#06121f;}
.btn.fold{background:#54606c;color:#fff;} .btn.check,.btn.call{background:var(--accent);}
.btn.raise{background:var(--gold);} .btn.next{background:var(--pos);color:#06121f;}
.btn.summary{background:#2b3a4d;color:#eef3f7;}
.slider-wrap{display:flex;align-items:center;gap:11px;flex:1;min-width:220px;}
.slider-wrap input[type=range]{flex:1;accent-color:var(--gold);height:8px;}
.raise-amt{color:var(--gold);font-weight:700;min-width:64px;font-size:20px;font-variant-numeric:tabular-nums;}
.quick{display:flex;gap:6px;} .qbtn{background:#1a2330;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-size:17px;}
.qbtn:hover{border-color:var(--gold);}

/* modal (trainers / stats / summary) */
.piq-modal{position:fixed;inset:0;background:rgba(4,8,12,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:30px;}
.modal-card{position:relative;background:#121922;border:1px solid var(--line);border-radius:16px;padding:28px 32px;max-width:900px;width:100%;max-height:88vh;overflow:auto;font-size:19px;}
.modal-card h2{margin:0 0 6px;font-size:28px;} .modal-card .sub{color:var(--muted);font-size:17px;margin-bottom:20px;}
.modal-actions{display:flex;gap:11px;justify-content:flex-end;margin-top:22px;}
.menu-pop{position:absolute;background:#121922;border:1px solid var(--line);border-radius:10px;padding:8px;z-index:60;display:flex;flex-direction:column;min-width:280px;}
.menu-pop button{background:transparent;border:0;color:var(--ink);text-align:left;padding:10px 14px;border-radius:8px;font-size:18px;}
.menu-pop button:hover{background:#1c2734;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 22px;font-variant-numeric:tabular-nums;font-size:19px;}
.kv .k{color:var(--muted);}
table.drill{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
table.drill td,table.drill th{border:1px solid var(--line);padding:9px 11px;text-align:center;font-size:17px;}
.notice{background:#1a1410;border:1px solid #4a3a1a;border-radius:10px;padding:16px 18px;color:#e0c08a;font-size:18px;line-height:1.5;}

/* hand summary */
.hs-streets{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;}
.hs-street{background:#0d141c;border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.hs-st-head{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.hs-st-name{font-weight:700;color:var(--gold);font-size:20px;min-width:84px;}
.hs-st-head .card{width:40px;height:56px;} .hs-st-head .card b{font-size:18px;} .hs-st-head .card i{font-size:15px;}
.hs-acts{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:17px;}
.hs-act{color:var(--ink);}
.hs-table .card{width:34px;height:48px;} .hs-table .card b{font-size:15px;} .hs-table .card i{font-size:13px;}
.hs-table td{font-size:16px;}

@media(max-width:820px){.piq-bottom{grid-template-columns:1fr;}.piq-feed{grid-row:auto;height:120px;}.seat{width:170px;}}

/* ============ Training toggle + Theory of Mind screen ============ */
.train-toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;background:#1a2330;border:1px solid var(--line);border-radius:20px;padding:6px 14px 6px 8px;user-select:none;}
.train-toggle .tt-knob{width:34px;height:18px;border-radius:10px;background:#3a4654;position:relative;transition:background .15s;}
.train-toggle .tt-knob::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#cfd6df;transition:left .15s;}
.train-toggle.on{border-color:var(--gold);} .train-toggle.on .tt-knob{background:var(--gold);} .train-toggle.on .tt-knob::after{left:18px;background:#1a1408;}
.train-toggle .tt-lab{font-size:17px;font-weight:600;}

.table-view{display:flex;flex-direction:column;flex:1;}
.piq-footer{padding:0 24px 18px;} .piq-footer .piq-actions{justify-content:center;}
.btn small.ev{display:block;font-size:13px;font-weight:600;margin-top:2px;opacity:.9;}
.btn small.ev.pos{color:#0a3d18;} .btn small.ev.neg{color:#5a1410;} .btn.fold small.ev{color:#cdd6df;}
.end-net{font-size:20px;font-weight:700;margin-right:14px;}

/* ToM view */
.tom-view{flex:1;display:flex;flex-direction:column;padding:14px 22px;gap:12px;overflow:auto;}
.tom-strip{display:flex;align-items:center;gap:10px;background:#161d27;border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex-wrap:wrap;}
.tom-strip .ts-lab{color:var(--muted);font-size:18px;font-weight:600;}
.tom-strip .ts-board{display:inline-flex;gap:5px;}
.tom-strip .ts-board .card{width:40px;height:56px;} .tom-strip .ts-board .card b{font-size:18px;} .tom-strip .ts-board .card i{font-size:15px;}
.tom-strip .ts-boardlabel{margin-left:auto;color:var(--gold);font-size:22px;font-weight:700;}
.tom-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.tom-metrics .tm{padding:12px 16px;border-radius:10px;font-size:21px;font-weight:700;border:1px solid var(--line);background:#11171f;}
.tom-metrics .tm.yellow{color:#ffd84d;} .tom-metrics .tm.blue{color:#58a6ff;} .tom-metrics .tm.orange{color:#f0883e;} .tom-metrics .tm.purple{color:#a87fff;}
.tom-outs{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.tom-outs .to-box{background:#11171f;border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:700;color:#7fe0a0;font-size:17px;}
.tom-outs .to-box:nth-child(2){color:#f0883e;}
.tom-outs .to-mode{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:16px;}
.rm{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--muted);}
.rm .dot{width:13px;height:13px;border-radius:50%;border:2px solid #4a5663;display:inline-block;}
.rm.weak.on{color:var(--pos);} .rm.weak.on .dot{background:var(--pos);border-color:var(--pos);}
.rm.neu.on{color:var(--ink);} .rm.neu.on .dot{background:#cfd6df;border-color:#cfd6df;}
.rm.strong.on{color:var(--neg);} .rm.strong.on .dot{background:var(--neg);border-color:var(--neg);}

.tom-main{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;flex:1;min-height:0;}
.tom-left{background:#11171f;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;}
.tom-tabbar{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);padding:6px 6px 0;}
.tom-tab{background:#1a2330;color:var(--muted);border:0;border-radius:7px 7px 0 0;padding:9px 16px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:7px;}
.tom-tab.active{background:#11171f;color:var(--ink);border:1px solid var(--line);border-bottom-color:#11171f;margin-bottom:-1px;}
.tdot{width:10px;height:10px;border-radius:50%;} .tdot.on{background:var(--pos);} .tdot.off{background:#55606c;}
.tom-tabcontent{flex:1;overflow:auto;padding:16px;min-height:0;}

.adv-head{background:#0a1d12;border:1px solid #1f4a30;border-radius:8px;padding:12px 14px;color:#bfe8cc;font-family:ui-monospace,Menlo,monospace;font-size:15px;line-height:1.5;margin-bottom:12px;white-space:pre-wrap;}
.adv-text .adv-line{font-size:18px;line-height:1.5;margin:6px 0;}
.tom-tabcontent .muted{color:var(--muted);}

.commit{background:#0d141c;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px;}
.commit h3{margin:0 0 10px;font-size:22px;}
.commit .cm{font-size:18px;margin:8px 0;}
.outs-head{display:flex;justify-content:space-between;align-items:baseline;}
.outs-head .made{color:var(--gold);font-weight:700;font-size:19px;} .outs-head .ocount{color:var(--pos);font-weight:700;font-size:19px;}
.outs-board{display:flex;flex-direction:column;gap:3px;background:#0d141c;border:1px solid var(--line);border-radius:8px;padding:8px;}
.ob-row{display:grid;grid-template-columns:30px repeat(13,1fr);gap:3px;}
.ob-head{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink);}
.ob-cell{text-align:center;padding:6px 0;border-radius:4px;font-weight:700;font-size:15px;border:1px solid #2a2a2a;color:#555;background:#222;}
.ob-cell.hole{color:#fff;background:#1a4d8a;border-color:#66aaff;} .ob-cell.board{color:#000;background:#fff;border-color:#ccc;}
.ob-cell.out{color:#000;background:#ffd966;border-color:#ffaa00;} .ob-cell.dim{color:#555;background:#222;}
.outs-list{margin-top:8px;color:#ffd966;font-family:ui-monospace,Menlo,monospace;font-size:17px;background:#0d141c;border:1px solid var(--line);border-radius:6px;padding:10px;}

.opp-tab{display:grid;grid-template-columns:auto 1fr;gap:16px;}
.opp-title{font-weight:700;font-size:20px;margin-bottom:8px;}
.range-grid{display:grid;grid-template-columns:repeat(13,1fr);gap:1px;width:430px;}
.rg-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#9aa;border:1px solid #2a2a2a;border-radius:2px;}
.rg-cell.pair{background:rgba(200,180,50,calc(var(--w)*0.85+0.06));}
.rg-cell.suited{background:rgba(50,180,50,calc(var(--w)*0.85+0.06));}
.rg-cell.offsuit{background:rgba(70,120,180,calc(var(--w)*0.85+0.06));}
.rg-cell.lit{color:#fff;}
.rg-cell.hit1{border-color:#ffdc3c;} .rg-cell.hit2{border:2px solid #ffdc3c;}
.opp-notation{margin-top:8px;color:#0f0;background:#11171f;border:1px solid var(--line);border-radius:6px;padding:8px;font-family:ui-monospace,Menlo,monospace;font-size:14px;width:430px;}
.opp-hist-head{background:#1d2a3a;border:1px solid #2f435a;border-radius:6px;padding:8px 12px;font-weight:700;text-align:center;margin-bottom:8px;}
.opp-hist{background:#0d141c;border:1px solid var(--line);border-radius:6px;padding:12px;font-size:17px;line-height:1.5;min-height:200px;}

.tom-right{min-height:0;}
.tom-dash{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px;height:100%;background:#181818;border:1px solid #333;border-radius:8px;padding:8px;}
.mtile{display:flex;flex-direction:column;background:#11171f;border:1px solid var(--line);border-radius:8px;padding:8px 10px;}
.mtile.dim{opacity:.55;}
.mt-bar{height:7px;border-radius:4px;background:#262626;overflow:hidden;margin-bottom:6px;}
.mt-fill{height:100%;border-radius:4px;}
.mt-val{font-size:30px;text-align:center;color:#ddd;}
.mt-cap{font-size:14px;text-align:center;color:#cfd6df;font-weight:700;line-height:1.2;margin-top:auto;padding-top:6px;}
.mtile.dim .mt-val,.mtile.dim .mt-cap{color:#6a7480;}
@media(max-width:900px){.tom-main{grid-template-columns:1fr;}.opp-tab{grid-template-columns:1fr;}.range-grid,.opp-notation{width:100%;}}

/* session log preview */
.log-preview{width:100%;height:52vh;margin-top:6px;background:#0b0f15;color:#cdd6df;border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;overflow:auto;}

/* ============ hotseat: privacy gate + players setup ============ */
.piq-gate{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 100% at 50% 30%,#16202b,#070b0f 80%);}
.gate-card{text-align:center;padding:40px 48px;}
.gate-icon{font-size:90px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.6));}
.gate-pass{color:var(--muted);font-size:22px;letter-spacing:.5px;}
.gate-name{color:var(--gold);font-size:48px;font-weight:800;margin:6px 0 4px;}
.gate-sub{color:var(--muted);font-size:17px;margin-bottom:26px;}
.gate-go{font-size:24px;padding:18px 34px;}

.players-grid{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
.pg-row{display:grid;grid-template-columns:80px 1fr 1fr;gap:12px;align-items:center;}
.pg-seat{color:var(--muted);font-weight:700;}
.pg-style,.pg-name{padding:10px 12px;background:#0d141c;color:var(--ink);border:1px solid var(--line);border-radius:8px;font:inherit;font-size:17px;}
.pg-name:disabled{opacity:.5;}

/* ============ fold→spectator (God view) panel + assist flags ============ */
.piq-spectator{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0b0f15;border-top:2px solid var(--line);
  padding:14px 24px 18px;box-shadow:0 -8px 30px rgba(0,0,0,.5);max-height:46vh;overflow:auto;}
.sp-head{display:flex;align-items:center;gap:18px;margin-bottom:10px;flex-wrap:wrap;}
.sp-title{font-size:20px;font-weight:700;color:var(--gold);}
.sp-board{display:inline-flex;gap:5px;}
.sp-board .card{width:36px;height:50px;} .sp-board .card b{font-size:16px;} .sp-board .card i{font-size:13px;}
.sp-pot{color:var(--gold);font-weight:700;font-size:18px;}
.sp-nav{margin-left:auto;display:flex;gap:8px;align-items:center;}
.sp-nav .ghost:disabled{opacity:.4;cursor:default;}
.sp-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.sp-table th{text-align:left;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.4px;padding:4px 10px;}
.sp-table td{padding:6px 10px;font-size:18px;vertical-align:middle;}
.sp-table td.me{color:var(--accent);font-weight:700;}

<script>
// ===== engine.js =====
/*
 * PokerIQ — JS hand-evaluator + Monte-Carlo equity engine (prototype).
 *
 * Self-contained, zero-dependency. Designed to replace the eval7 C-extension
 * (calc_equity_* in pokerIQ.py) and the pure-Python poker_iq/evaluator.py.
 *
 * Card model mirrors poker_iq/models.py:
 *   rank: 2..14 (14 = Ace), suit: 0..3 = c,d,h,s
 *   string form: "Ah", "Ks", "2c"   |   code 0..51 = (rank-2)*4 + suit
 *
 * evaluate7() returns ONE comparable integer: higher = better hand.
 * Encoding: category(4b) << 20 | t1<<16 | t2<<12 | t3<<8 | t4<<4 | t5
 * The absolute number is meaningless across engines; only the ordering matters,
 * and that ordering matches eval7 / poker_iq exactly (proven by validate.js).
 */

(function (root) {
  'use strict';

  const RANKS = '23456789TJQKA';      // index 0 -> rank 2
  const SUITS = 'cdhs';                // index 0 -> clubs

  // ---- category constants (match poker_iq HandRank ordering) ----
  const CAT = {
    HIGH_CARD: 0, ONE_PAIR: 1, TWO_PAIR: 2, TRIPS: 3, STRAIGHT: 4,
    FLUSH: 5, FULL_HOUSE: 6, QUADS: 7, STRAIGHT_FLUSH: 8,
  };
  const CAT_NAMES = [
    'High Card', 'One Pair', 'Two Pair', 'Three of a Kind', 'Straight',
    'Flush', 'Full House', 'Four of a Kind', 'Straight Flush',
  ];

  function rankToChar(r) { return RANKS[r - 2]; }
  function charToRank(c) {
    const i = RANKS.indexOf(c.toUpperCase());
    if (i < 0) throw new Error('bad rank: ' + c);
    return i + 2;
  }
  function charToSuit(c) {
    const i = SUITS.indexOf(c.toLowerCase());
    if (i < 0) throw new Error('bad suit: ' + c);
    return i;
  }

  // A card is encoded as the small integer (rank << 2) | suit for speed.
  // rank 2..14, suit 0..3.  (This is NOT the 0..51 deck code; see codeOf.)
  function cardFromStr(s) {
    s = s.trim();
    return (charToRank(s[0]) << 2) | charToSuit(s[1]);
  }
  function cardToStr(card) {
    return rankToChar(card >> 2) + SUITS[card & 3];
  }
  function rankOf(card) { return card >> 2; }
  function suitOf(card) { return card & 3; }
  // 0..51 deck code, matching poker_iq Card.to_code(): (rank-2)*4 + suit
  function codeOf(card) { return (rankOf(card) - 2) * 4 + suitOf(card); }
  function cardFromCode(code) { return (((code >> 2) + 2) << 2) | (code & 3); }

  function fullDeck() {
    const d = new Array(52);
    for (let c = 0; c < 52; c++) d[c] = cardFromCode(c);
    return d;
  }

  // Highest 5-in-a-row in a rank bitmask (bits 2..14). Returns high rank or 0.
  // Handles the wheel (A-2-3-4-5) by mirroring the ace to bit 1.
  function straightHigh(mask) {
    let m = mask;
    if (m & (1 << 14)) m |= (1 << 1);     // ace plays low
    // window of 5 consecutive bits, from ace-high down to 5-high (wheel)
    for (let hi = 14; hi >= 5; hi--) {
      const need = 0b11111 << (hi - 4);    // bits hi..hi-4
      if ((m & need) === need) return hi;
    }
    return 0;
  }

  /**
   * Evaluate the best 5-card poker hand from 5, 6, or 7 cards.
   * @param {number[]} cards  array of card ints (rank<<2|suit)
   * @returns {number} comparable score (higher = better)
   */
  function evaluate(cards) {
    const rankCount = new Int8Array(15);          // index = rank 2..14
    const suitMask = [0, 0, 0, 0];                // per-suit rank bitmask
    const suitCnt = [0, 0, 0, 0];
    let rankMask = 0;

    for (let i = 0; i < cards.length; i++) {
      const c = cards[i];
      const r = c >> 2, s = c & 3;
      rankCount[r]++;
      suitMask[s] |= (1 << r);
      suitCnt[s]++;
      rankMask |= (1 << r);
    }

    // --- flush / straight-flush ---
    let flushSuit = -1;
    for (let s = 0; s < 4; s++) if (suitCnt[s] >= 5) { flushSuit = s; break; }
    if (flushSuit >= 0) {
      const sfHigh = straightHigh(suitMask[flushSuit]);
      if (sfHigh) return enc(CAT.STRAIGHT_FLUSH, sfHigh);
    }

    // --- count-based categories: build ranks-by-count descending ---
    // quads / trips / pairs lists, each sorted high->low by virtue of scan.
    let quad = 0, tripsHi = 0, tripsLo = 0, pairHi = 0, pairMid = 0;
    for (let r = 14; r >= 2; r--) {
      const n = rankCount[r];
      if (n === 4) quad = r;
      else if (n === 3) { if (!tripsHi) tripsHi = r; else if (!tripsLo) tripsLo = r; }
      else if (n === 2) { if (!pairHi) pairHi = r; else if (!pairMid) pairMid = r; }
    }

    if (quad) {
      const k = topRanks(rankCount, 1, [quad]);
      return enc(CAT.QUADS, quad, k[0]);
    }

    // full house: best trips + best pair (a 2nd trips counts as the pair)
    if (tripsHi) {
      let pair = pairHi;
      if (tripsLo && tripsLo > pair) pair = tripsLo;     // 2nd trips as pair
      if (pair) return enc(CAT.FULL_HOUSE, tripsHi, pair);
    }

    if (flushSuit >= 0) {
      const fr = topBits(suitMask[flushSuit], 5);
      return enc(CAT.FLUSH, fr[0], fr[1], fr[2], fr[3], fr[4]);
    }

    const sHigh = straightHigh(rankMask);
    if (sHigh) return enc(CAT.STRAIGHT, sHigh);

    if (tripsHi) {
      const k = topRanks(rankCount, 2, [tripsHi]);
      return enc(CAT.TRIPS, tripsHi, k[0], k[1]);
    }

    if (pairHi && pairMid) {
      const k = topRanks(rankCount, 1, [pairHi, pairMid]);
      return enc(CAT.TWO_PAIR, pairHi, pairMid, k[0]);
    }

    if (pairHi) {
      const k = topRanks(rankCount, 3, [pairHi]);
      return enc(CAT.ONE_PAIR, pairHi, k[0], k[1], k[2]);
    }

    const k = topRanks(rankCount, 5, []);
    return enc(CAT.HIGH_CARD, k[0], k[1], k[2], k[3], k[4]);
  }

  // pack category + up to 5 tiebreak ranks into one int
  function enc(cat, t1 = 0, t2 = 0, t3 = 0, t4 = 0, t5 = 0) {
    return (cat << 20) | (t1 << 16) | (t2 << 12) | (t3 << 8) | (t4 << 4) | t5;
  }

  // top `n` ranks present (by count, high->low), excluding `exclude` ranks
  function topRanks(rankCount, n, exclude) {
    const out = [];
    for (let r = 14; r >= 2 && out.length < n; r--) {
      if (exclude.indexOf(r) >= 0) continue;
      let c = rankCount[r];
      while (c-- > 0 && out.length < n) out.push(r);
    }
    return out;
  }
  // top `n` set bits of a rank bitmask, high->low
  function topBits(mask, n) {
    const out = [];
    for (let r = 14; r >= 2 && out.length < n; r--) if (mask & (1 << r)) out.push(r);
    return out;
  }

  function categoryOf(score) { return score >> 20; }
  function describe(score) {
    const cat = categoryOf(score);
    const t1 = (score >> 16) & 0xf, t2 = (score >> 12) & 0xf;
    const rc = rankToChar;
    switch (cat) {
      case CAT.STRAIGHT_FLUSH: return t1 === 14 ? 'Royal Flush' : `Straight Flush, ${rc(t1)}-high`;
      case CAT.QUADS: return `Four of a Kind, ${rc(t1)}s`;
      case CAT.FULL_HOUSE: return `Full House, ${rc(t1)}s full of ${rc(t2)}s`;
      case CAT.FLUSH: return `Flush, ${rc(t1)}-high`;
      case CAT.STRAIGHT: return `Straight, ${rc(t1)}-high`;
      case CAT.TRIPS: return `Three of a Kind, ${rc(t1)}s`;
      case CAT.TWO_PAIR: return `Two Pair, ${rc(t1)}s and ${rc(t2)}s`;
      case CAT.ONE_PAIR: return `Pair of ${rc(t1)}s`;
      default: return `High Card, ${rc(t1)}`;
    }
  }

  // ---------- Monte-Carlo equity ----------
  // Fisher-Yates partial shuffle on the live deck (in place, first k slots).
  function dealShuffle(deck, n, k, rng) {
    for (let i = 0; i < k; i++) {
      const j = i + Math.floor(rng() * (n - i));
      const t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
  }

  /**
   * Equity of hero vs N random opponents (mirrors calc_equity_hidden).
   * @param {number[]} hero    2 hero cards
   * @param {number[]} board   0..5 board cards
   * @param {object} opts {iterations=2000, opponents=1, rng=Math.random}
   * @returns {number} win probability incl. tie split, 0..1
   */
  function equityVsRandom(hero, board, opts = {}) {
    const iterations = opts.iterations || 2000;
    const opponents = opts.opponents || 1;
    const rng = opts.rng || Math.random;

    const used = new Set([...hero, ...board].map(codeOf));
    const liveBase = fullDeck().filter(c => !used.has(codeOf(c)));
    const need = 5 - board.length;
    const draw = opponents * 2 + need;

    let wins = 0, ties = 0, done = 0;
    const hand = new Array(7);
    for (let it = 0; it < iterations; it++) {
      const n = liveBase.length;
      if (n < draw) break;
      dealShuffle(liveBase, n, draw, rng);

      // complete board
      let bi = 0;
      const full = board.slice();
      for (let i = 0; i < need; i++) full.push(liveBase[bi++]);

      // hero score
      hand.length = 0;
      for (const c of hero) hand.push(c);
      for (const c of full) hand.push(c);
      const heroScore = evaluate(hand);

      let bestOpp = -1;
      for (let o = 0; o < opponents; o++) {
        hand.length = 0;
        hand.push(liveBase[bi++], liveBase[bi++]);
        for (const c of full) hand.push(c);
        const s = evaluate(hand);
        if (s > bestOpp) bestOpp = s;
      }
      if (heroScore > bestOpp) wins++;
      else if (heroScore === bestOpp) ties++;
      done++;
    }
    return done ? (wins + ties / 2) / done : 0;
  }

  /**
   * Multiway equity — each known hand's share of the pot (mirrors
   * calc_multiway_equity). Returns array of equities aligned to `hands`.
   * @param {number[][]} hands  array of 2-card hands
   * @param {number[]} board    0..5 board cards
   */
  function equityMultiway(hands, board, opts = {}) {
    const iterations = opts.iterations || 2000;
    const rng = opts.rng || Math.random;
    const used = new Set();
    for (const h of hands) for (const c of h) used.add(codeOf(c));
    for (const c of board) used.add(codeOf(c));
    const liveBase = fullDeck().filter(c => !used.has(codeOf(c)));
    const need = 5 - board.length;

    const eq = new Array(hands.length).fill(0);
    const hand = new Array(7);
    let done = 0;
    for (let it = 0; it < iterations; it++) {
      const n = liveBase.length;
      if (n < need) break;
      dealShuffle(liveBase, n, need, rng);
      const full = board.slice();
      for (let i = 0; i < need; i++) full.push(liveBase[i]);

      let best = -1; const scores = new Array(hands.length);
      for (let p = 0; p < hands.length; p++) {
        hand.length = 0;
        hand.push(hands[p][0], hands[p][1]);
        for (const c of full) hand.push(c);
        const s = evaluate(hand);
        scores[p] = s;
        if (s > best) best = s;
      }
      let winners = 0;
      for (let p = 0; p < hands.length; p++) if (scores[p] === best) winners++;
      for (let p = 0; p < hands.length; p++) if (scores[p] === best) eq[p] += 1 / winners;
      done++;
    }
    if (done) for (let p = 0; p < eq.length; p++) eq[p] /= done;
    return eq;
  }

  const API = {
    CAT, CAT_NAMES,
    cardFromStr, cardToStr, cardFromCode, codeOf, rankOf, suitOf, fullDeck,
    evaluate, categoryOf, describe, straightHigh,
    equityVsRandom, equityMultiway,
    // helpers for tests
    handFromStr: s => s.trim().split(/\s+/).map(cardFromStr),
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  else root.PokerEngine = API;
})(typeof globalThis !== 'undefined' ? globalThis : this);


// ===== game.js =====
/*
 * PokerIQ — game engine (betting, side pots, showdown).
 *
 * Ports TextModeGame + Player from pokerIQ.py into a UI-agnostic state machine.
 * The original text/GUI loop is synchronous; here the engine is event-driven so
 * a browser UI can drive it one action at a time:
 *
 *   const g = new Game(opts);
 *   g.dealHand();
 *   while (g.awaitingAction) {
 *     const seat = g.toAct;                 // whose turn
 *     g.applyAction(seat, 'r', amount);     // f / c / r
 *   }                                        // engine auto-runs bots if wired
 *
 * Differences from the Python reference (improvements, not regressions):
 *  - TRUE side pots at showdown (the text version just split the whole pot;
 *    this tracks total_invested per player and builds layered pots).
 *  - Deterministic RNG injectable for tests.
 *
 * Depends on engine.js (PokerEngine) for hand evaluation.
 */
(function (root) {
  'use strict';
  const E = (typeof require !== 'undefined') ? require('./engine.js') : root.PokerEngine;

  const STREETS = ['Preflop', 'Flop', 'Turn', 'River'];
  const STARTING_STACK = 200;
  const HANDS_PER_BLIND_LEVEL = 10;
  const BLIND_LEVELS = [
    [1, 2], [2, 4], [3, 6], [5, 10], [10, 20],
    [15, 30], [25, 50], [50, 100], [75, 150], [100, 200],
  ];

  // Canonical 5-bot lineup (one of each archetype), matching pokerIQ.py.
  const DEFAULT_BOT_LINEUP = [
    ['Tight Tim', 'tight'],
    ['Loose Bruce', 'loose'],
    ['Aggro Angela', 'aggressive'],
    ['Sharkey Steve', 'shark'],
    ['Fluid Fiona', 'tom'],
  ];

  const CUTE_NAMES = {
    optimal: 'Optimal Olivia', tight: 'Tight Tim', loose: 'Loose Bruce',
    station: 'Station Stan', aggressive: 'Aggro Angela', tom: 'Fluid Fiona',
    shark: 'Sharkey Steve', exploit: 'Exploit Eli', icm: 'ICM Ian',
    piq_basic_equity: 'Equity Eddie', piq_improved_equity: 'Savvy Sarah',
  };

  function makeRandomLineup(rng) {
    const pool = DEFAULT_BOT_LINEUP.map(x => x.slice());
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    return pool;
  }

  class Player {
    constructor(name, style, seat) {
      this.name = name;
      this.style = style;       // 'human' or a bot style id
      this.seat = seat;
      this.stack = STARTING_STACK;
      this.hand = [];           // array of card ints (engine encoding)
      this.active = true;       // still in this hand (not folded/out)
      this.betInRound = 0;
      this.actionsThisRound = 0;
      this.totalInvested = 0;   // chips committed this hand (for side pots)
      this.lastAction = null;   // 'fold'|'check'|'call'|'raise'|'post'
      this.allIn = false;
      this.botType = null;      // for piq_* equity bots
    }
    resetForHand() {
      this.hand = [];
      this.active = this.stack > 0;
      this.betInRound = 0;
      this.actionsThisRound = 0;
      this.totalInvested = 0;
      this.lastAction = null;
      this.allIn = false;
    }
    get isHuman() { return this.style === 'human'; }
  }

  class Game {
    /**
     * @param {object} opts
     *   rng           : () => [0,1)            (default Math.random)
     *   godMode       : boolean
     *   numBots       : 1..5 (default 5)
     *   onEvent       : (type, payload) => void   UI hook
     *   botDecide     : (game, player) => [action, amount]   AI hook
     */
    constructor(opts = {}) {
      this.rng = opts.rng || Math.random;
      this.godMode = !!opts.godMode;
      this.onEvent = opts.onEvent || function () {};
      this.botDecide = opts.botDecide || null;
      this.manualBots = !!opts.manualBots;   // when true, caller paces bot turns
      this.awaitingBot = -1;                 // seat a bot is about to act from

      if (opts.seats && opts.seats.length >= 2) {
        // explicit lineup: [{name, style}] — style 'human' or a bot style id.
        // Used by hotseat (multiple human seats) and custom tables.
        this.players = opts.seats.map((s, i) => new Player(s.name, s.style, i));
      } else {
        const lineup = makeRandomLineup(this.rng).slice(0, opts.numBots || 5);
        this.players = [new Player('Hero (You)', 'human', 0)]
          .concat(lineup.map((x, i) => new Player(x[0], x[1], i + 1)));
      }

      this.deck = [];
      this.board = [];
      this.pot = 0;
      this.dealerIdx = 0;
      this.currentBet = 0;
      this.streetIdx = 0;
      this.toAct = -1;            // seat index whose turn it is (-1 = none)
      this.minRaiseTo = 0;        // minimum legal raise-to amount
      this.lastRaiseSize = 0;     // size of last bet/raise increment
      this.handNumber = 0;
      this.blindLevel = 0;
      this.handInProgress = false;
      this.awaitingAction = false;
      this.actionLog = [];
      this.lastResult = null;     // populated at end of hand
    }

    // ---- helpers ----
    bb() { return BLIND_LEVELS[this.blindLevel][1]; }
    sb() { return BLIND_LEVELS[this.blindLevel][0]; }
    activePlayers() { return this.players.filter(p => p.active); }
    log(msg) { this.actionLog.push(msg); this.onEvent('log', msg); }

    nextActiveSeat(from) {
      const n = this.players.length;
      let i = (from + 1) % n;
      for (let c = 0; c < n; c++) {
        if (this.players[i].active) return i;
        i = (i + 1) % n;
      }
      return from;
    }

    // Position label relative to dealer (BT/SB/BB/UTG/CO/MP)
    positionOf(seat) {
      const n = this.players.length;
      const off = (seat - this.dealerIdx + n) % n;
      if (off === 0) return 'BT';
      if (off === 1) return 'SB';
      if (off === 2) return 'BB';
      if (off === n - 1 && n >= 5) return 'CO';
      if (off === 3) return 'UTG';
      return 'MP';
    }

    buildDeck() {
      const used = new Set();
      for (const p of this.players) for (const c of p.hand) used.add(E.codeOf(c));
      for (const c of this.board) used.add(E.codeOf(c));
      const d = E.fullDeck().filter(c => !used.has(E.codeOf(c)));
      // Fisher-Yates with injected rng
      for (let i = d.length - 1; i > 0; i--) {
        const j = Math.floor(this.rng() * (i + 1));
        const t = d[i]; d[i] = d[j]; d[j] = t;
      }
      return d;
    }
    draw(n) { return this.deck.splice(0, n); }

    // ---- hand lifecycle ----
    dealHand() {
      this.handNumber += 1;
      // blind increase every N hands
      if (this.handNumber > 1 && (this.handNumber - 1) % HANDS_PER_BLIND_LEVEL === 0
          && this.blindLevel < BLIND_LEVELS.length - 1) {
        this.blindLevel += 1;
        this.log(`*** Blinds up to $${this.sb()}/$${this.bb()} ***`);
      }

      this.board = [];
      for (const p of this.players) p.resetForHand();
      this.deck = this.buildDeck();
      this.pot = 0;
      this.currentBet = 0;
      this.streetIdx = 0;
      this.actionLog = [];
      this.lastResult = null;
      this.handInProgress = true;

      if (this.activePlayers().length < 2) {
        this.handInProgress = false;
        this.onEvent('needReset', null);
        return false;
      }

      // advance dealer to an active seat
      this.dealerIdx = this.nextActiveSeat(this.dealerIdx);

      // deal hole cards
      for (const p of this.players) if (p.active) p.hand = this.draw(2);

      // announce the hand BEFORE blinds so listeners can record the blind
      // posts (and start stacks) into their per-hand history.
      this.onEvent('handStart', {
        handNumber: this.handNumber, dealer: this.dealerIdx,
        startStacks: this.players.map(p => ({ seat: p.seat, name: p.name, stack: p.stack })),
      });

      // blinds
      const sbSeat = this.nextActiveSeat(this.dealerIdx);
      const bbSeat = this.nextActiveSeat(sbSeat);
      this.postBlind(this.players[sbSeat], this.sb(), 'small blind');
      this.postBlind(this.players[bbSeat], this.bb(), 'big blind');
      this.currentBet = this.bb();
      this.minRaiseTo = this.bb() * 2;
      this.lastRaiseSize = this.bb();

      this.toAct = this.nextActiveSeat(bbSeat);
      this.beginStreetActors();
      this.awaitingAction = true;
      this.advanceToActionable(true);
      return true;
    }

    postBlind(player, amount, kind) {
      const actual = Math.min(amount, player.stack);
      player.stack -= actual;
      player.betInRound = actual;
      player.totalInvested = actual;
      if (player.stack === 0) player.allIn = true;
      this.pot += actual;
      player.lastAction = 'post';
      this.log(`${player.name} posts ${kind} $${actual}`);
      this.onEvent('action', { seat: player.seat, action: 'post', amount: actual,
        total: player.betInRound, pot: this.pot, streetIdx: 0 });
    }

    beginStreetActors() {
      for (const p of this.players) p.actionsThisRound = 0;
    }

    // ---- turn engine ----
    // Returns true if the current seat needs a human decision; otherwise
    // auto-resolves bots and street/hand transitions until it does or the
    // hand ends.
    advanceToActionable(justStarted) {
      if (!justStarted) {} // (kept for symmetry/readability)
      let guard = 0;
      while (this.handInProgress) {
        if (++guard > 10000) throw new Error('engine loop guard tripped');

        if (this.activePlayers().length < 2) { this.endHand(); return false; }

        if (this.roundComplete()) {
          if (!this.nextStreet()) return false;   // hand ended
          continue;
        }

        const p = this.players[this.toAct];
        const needsToAct = p.active && !p.allIn &&
          (p.actionsThisRound === 0 || p.betInRound < this.currentBet);

        if (!needsToAct) { this.toAct = this.nextActiveSeat(this.toAct); continue; }

        if (p.isHuman) {
          this.awaitingAction = true;
          this.onEvent('awaitAction', { seat: this.toAct, ...this.legalActions(this.toAct) });
          return true;
        }
        // bot turn
        if (this.manualBots) {
          // hand control back so the caller can pace this bot's action on a
          // timer (for watchable play); resume via stepBot().
          this.awaitingBot = this.toAct;

/*
 * PokerIQ — session log writer. Reproduces the PyQt pokerIQ log file format
 * EXACTLY (byte-for-byte where it matters) so a saved web-app log can be fed to
 * an AI for the same post-game analysis/commentary the desktop app supports.
 *
 * The PyQt app writes the file via a stream of write_log(msg) calls (log_action
 * funnels through the same path). We model that precisely: LogBook records each
 * msg in order; text() === msgs.join("\n") + "\n", which is exactly what
 * f.write(msg + "\n") per call produces.
 *
 * Reference: pokerIQ.py init_logfile / _log_game_status / deal_hand /
 * post_blind / process_action / deal_community / showdown / _log_session_summary.
 */
(function (root) {
  'use strict';
  const HANDTYPE = ['High Card', 'Pair', 'Two Pair', 'Trips', 'Straight', 'Flush', 'Full House', 'Quads', 'Straight Flush'];

  // python-style padding helpers
  const padR = (s, n) => { s = String(s); return s.length >= n ? s : s + ' '.repeat(n - s.length); };  // {:<n}
  const padL = (s, n) => { s = String(s); return s.length >= n ? s : ' '.repeat(n - s.length) + s; };  // {:>n}
  const pct1 = f => (f * 100).toFixed(1) + '%';   // python {:.1%}

  class LogBook {
    constructor() { this.msgs = []; this.gameStatusLogged = false; }
    w(msg) { this.msgs.push(msg); }
    text() { return this.msgs.join('\n') + '\n'; }

    // ---- session header (init_logfile) ----
    sessionHeader(startedStr) {
      const bar = '='.repeat(60);
      this.w(bar);
      this.w('POKER LEARNING GAME - SESSION LOG');
      this.w(`Started: ${startedStr}`);
      this.w(bar);
      this.w('');                       // init_logfile's trailing blank line
    }

    // ---- GAME STATUS (first hand only) ----
    gameStatus(g) {
      this.w('\n=== GAME STATUS ===');
      this.w(`  Game Name: ${g.mode}`);
      this.w("  Game Type: Texas Hold 'em");
      this.w('  Limit Type: No Limit');
      this.w(`  Starting Chips: $${g.startingChips}`);
      this.w(`  Hands Dealt: ${g.handsDealt}`);
      this.w(`  Next Blind Increase: ${g.nextBlind}`);
      this.w(`  # Players (Original/Current): ${g.origPlayers}/${g.curPlayers}`);
      this.w(`  Blinds (Original/Current): $${g.origSb}/$${g.origBb} → $${g.curSb}/$${g.curBb}`);
      this.w('  Ante: None');
      this.w('  Limits: N/A');
      this.w('===================\n');
    }

    // ---- per-hand ----
    newHand(n, timeStr) {
      const bar = '='.repeat(60);
      this.w('=== NEW HAND ===');     // log_action
      this.w('\n' + bar);             // write_log(f"\n{'='*60}")
      this.w(`HAND #${n} - ${timeStr}`);
      this.w(bar);
    }
    blindIncrease(sb, bb) { this.w(`*** BLINDS INCREASE: $${sb}/$${bb} ***`); }
    dealerAndHole(dealerName, hole) {
      this.w(`Dealer: ${dealerName}`);
      this.w('Hole Cards Dealt:');
      for (const h of hole) this.w(`  ${h.name}: ${h.cards}`);
    }
    post(name, amt) { this.w(`${name} posts $${amt}`); }
    fold(name) { this.w(`${name}: Folds`); }
    check(name) { this.w(`${name}: Checks`); }
    call(name, amt) { this.w(`${name}: Calls $${amt}`); }
    raise(name, total) { this.w(`${name}: Raises to $${total}`); }

    // street: "--- Street ---" then [STATS] block then "Board: ..."
    street(streetName, statsRows, boardStr) {
      this.w(`--- ${streetName} ---`);
      this.w('  [STATS]');
      for (const r of statsRows) {
        this.w(`    ${padR(r.name, 15)} Cards: ${r.cards}  Equity: ${pct1(r.equity)}  PotOdds: ${pct1(r.potOdds)}`);
      }
      this.w(`Board: ${boardStr}`);
    }

    showdownResults(rows) { for (const r of rows) this.w(`${r.name}: ${HANDTYPE[r.cat]}`); }
    winnerUncontested(name, net) { this.w(`${name} wins $${net}!`); this.w(`Winner: ${name} - $${net} (others folded)`); }
    winnerShowdown(winners) { this.w(`WINNER: ${winners.map(w => `${w.name} ($${w.net})`).join(', ')}!`); }
    finalStacks(rows) { this.w('Final Stacks:'); for (const r of rows) this.w(`  ${r.name}: $${r.stack}`); }
    gainLoss(rows) {
      this.w('Hand Results (Gain/Loss):');
      for (const r of rows) {
        if (r.change > 0) this.w(`  ${r.name}: +$${r.change}`);
        else if (r.change < 0) this.w(`  ${r.name}: -$${Math.abs(r.change)}`);
        else this.w(`  ${r.name}: $0 (broke even)`);
      }
    }

    // ---- session summary (_log_session_summary) ----
    sessionSummary(s) {
      this.w('\n' + '#'.repeat(60));
      this.w('SESSION SUMMARY');
      this.w('#'.repeat(60));
      // TABLE STATS
      this.w('\n=== TABLE STATS ===');
      this.w('  ' + padR('Name', 16) + ' ' + padL('Status', 10) + ' ' + padL('Hands Played', 14) + ' ' + padL('Hands Won', 11) + ' ' + padL('Showdowns W/Total', 20) + ' ' + padL('All Ins', 9));
      for (const p of s.tableStats) {
        this.w('  ' + padR(p.name.slice(0, 16), 16) + ' ' + padL('$' + p.stack, 10) + ' ' + padL(p.handsPlayed, 14) + ' ' + padL(p.handsWon, 11) + ' ' + padL(`${p.showdownsWon}/${p.showdownsSeen}`, 20) + ' ' + padL(p.allIns, 9));
      }
      this.w('===================\n');

        this.w('\n=== HOLE CARD STATS (Hero) ===');

          if (this.botDelayMs <= 0) {
            let gd = 0;
            while (g.handInProgress && g.awaitingBot >= 0) { if (++gd > 500) break; g.stepBot(); }
            this.render(); return;
          }
          this.render();
          this.timer(() => { g.stepBot(); this.pump(); }, this.botDelayMs);
          return;
        }
        this.render(); return;
      }
      if (this.humanToAct()) {
        // hotseat: wait on the privacy gate until the player arms; otherwise
        // it's this human's turn to act.
        if (!this.passGate) this.stats.actionStarted();
        this.render();
        return;
      }
      if (g.handInProgress && g.awaitingBot >= 0) {
        if (this.botDelayMs <= 0) {
          let guard = 0;
          while (g.handInProgress && g.awaitingBot >= 0 && !this.humanToAct()) {
            if (++guard > 500) break;
            g.stepBot();
          }
          if (this.humanToAct() && !this.passGate) this.stats.actionStarted();
          this.render();
          return;
        }
        this.render();
        this.timer(() => { g.stepBot(); this.pump(); }, this.botDelayMs);
        return;
      }
      this.render();
    }

    onHandComplete(result) {
      this.handResult = result;
      const heroNet = (result.net.find(n => n.seat === 0) || { net: 0 }).net;
      this.stats.recordHandResult(heroNet);
      this.render();
      this.onHandEnd(result);
    }

    // derive a player's action-tag set this hand from the history
    actionTagsFor(seat) {
      const tags = new Set();
      if (!this.history) return tags;
      let preflopRaises = 0;
      this.history.streets.forEach((st, sIdx) => {
        for (const a of st.actions) {
          if (a.seat !== seat) continue;
          if (sIdx === 0) {
            if (a.action === 'raise') { preflopRaises++; }
          } else {
            if (a.action === 'raise') tags.add(a.opening ? 'bet_postflop' : 'raised_postflop');
            else if (a.action === 'call') tags.add('called_postflop');
          }
        }
      });
      if (preflopRaises >= 4) tags.add('five_bet_plus');
      else if (preflopRaises === 3) tags.add('four_bet');
      else if (preflopRaises === 2) tags.add('three_bet');
      else if (preflopRaises === 1) tags.add('raised');
      return tags;
    }

    // Gordon's four setup-question answers, from the opponent model
    gordonSetup() {
      const T = getToMLogic();
      // field aggregate VPIP/PFR
      let v = 0, p = 0, n = 0;
      for (const pl of this.game.players) {
        if (pl.isHuman) continue;
        const s = this.oppModel.stats[pl.name];
        if (!s || s.hands < 3) continue;
        const seen = s.hands; v += (s.vpip || 0); p += (s.pfr || 0); n += seen;
      }
      let style = 'n/a yet (need a few hands of sample)';
      if (n >= 6) { const vp = 100 * v / n, pf = 100 * p / n; const tag = vp < 20 ? 'TIGHT' : vp < 35 ? 'NORMAL' : 'LOOSE'; style = `<b>${tag}</b> · field VPIP ${vp.toFixed(0)}%, PFR ${pf.toFixed(0)}% · n=${n}`; }
      // acting player's image (their own session VPIP/PFR)
      let image = 'no sample yet';
      const heroName = this.game.players[this.heroSeat()].name;
      const hi = this.oppModel.stats[heroName];
      if (hi && hi.hands >= 3) { const vp = 100 * (hi.vpip || 0) / hi.hands, pf = 100 * (hi.pfr || 0) / hi.hands; const tag = vp < 20 ? 'TIGHT image' : vp < 35 ? 'balanced image' : 'LOOSE image'; const tail = vp < 20 ? 'they fold to your bets, fold-equity is high' : vp < 35 ? 'standard respect' : 'they call you down — value-bet thin, bluff less'; image = `<b>${tag}</b> · your VPIP ${vp.toFixed(0)}% / PFR ${pf.toFixed(0)}% · ${tail}`; }
      const posMap = { UTG: '<b style="color:#ff7777">EARLY</b> — act first; play tight.', MP: '<b style="color:#ffd966">MIDDLE</b> — neutral.', CO: '<b style="color:#88ff88">LATE</b> — second-best seat; wide opens profitable.', BTN: '<b style="color:#88ff88">LATE</b> — best seat; widest open range.', SB: '<b style="color:#ff7777">BLIND</b> — out of position post-flop; -EV seat.', BB: '<b style="color:#ff7777">BLIND</b> — out of position post-flop; -EV seat.' };
      return { style, ranges: 'see per-bot tabs — each opponent\'s estimated range narrows as the betting progresses', image, position: posMap[this.game.positionOf(this.heroSeat())] || 'n/a' };
    }

    // Full Theory-of-Mind snapshot for the training screen.
    tomData() {
      const T = getToMLogic(), g = this.game, hs = this.heroSeat(), hero = g.players[hs];
      const street = this.streetName();
      const toCall = Math.max(0, g.currentBet - hero.betInRound);
      const potOdds = (g.pot + toCall) > 0 ? toCall / (g.pot + toCall) : 0;
      const oppsActive = g.activePlayers().filter(pp => pp !== hero);
      const mode = this.rangeMode;

      // per-opponent estimated ranges
      const opponents = g.players.filter(pp => pp.seat !== hs).map(pp => {
        const tags = this.actionTagsFor(pp.seat);
        const er = T.estimateRange(pp.style, mode, tags, g.board);
        return { name: pp.name, active: pp.active, range: er.range, notation: er.notation, explanation: er.explanation, boardHits: er.boardHits };
      });

      // no-peek equity vs active opponents' ranges
      let equity = null;
      if (hero.hand.length && hero.active) {
        const ranges = oppsActive.map(pp => {
          const tags = this.actionTagsFor(pp.seat);
          return T.estimateRange(pp.style, mode, tags, g.board).range;
        });
        equity = ranges.length ? T.equityVsRanges(hero.hand, g.board, ranges, { iterations: this.opts.equityIters || 350, rng: this.auxRng }) : null;
        if (equity == null) equity = this.heroEquity;   // fall back to vs-random
      }
      const equityPct = equity != null ? equity * 100 : null;

      // outs + scare + commitment
      const outs = T.computeOuts(hero.hand, g.board);
      const scare = T.scareCards(hero.hand, g.board);
      const commit = { pot: g.pot, toCall, stack: hero.stack };

      // implied label
      const avgOpp = oppsActive.length ? oppsActive.reduce((a, pp) => a + pp.stack, 0) / oppsActive.length : 0;
      const eff = Math.min(hero.stack, avgOpp);
      const impliedPct = (toCall > 0) ? 100 * toCall / (g.pot + toCall + 0.5 * eff) : null;
      const unraised = street === 'Preflop' && toCall > 0 && g.currentBet <= g.bb();
      const potOddsLabel = toCall > 0
        ? `${(potOdds * 100).toFixed(1)}%${unraised ? ' (unraised — not a fold signal)' : ''}`
        : 'no bet';
      const impliedLabel = impliedPct != null ? `${impliedPct.toFixed(1)}% ($${hero.stack - toCall} behind)` : '--';

      // advisor (Gordon)
      const lastAggr = this.lastAggressorSeat();
      const ctx = {
        pot: g.pot, toCall, potOdds, currentBet: g.currentBet, numOpponents: oppsActive.length || 1,
        bb: g.bb(), heroStack: hero.stack, heroPosition: g.positionOf(hs), street,
        heroHand: hero.hand, equity: equity || 0, board: g.board,
        noPeekEquity: equity, hasInitiative: lastAggr === 0,
      };
      const key = T.handToKey(hero.hand);
      const advice = (hero.hand.length && key) ? T.gordonAdvice(ctx, key, this.gordonSetup()) : null;
      const potOddsHeader = T.potOddsHeader(ctx);

      // metrics
      const m = T.metrics(ctx);
      m.tilt = (() => { const t = this.tilt.update(this.stats.decisionTimes); return t.tilted ? 45 : Math.min(20, this.stats.decisionTimes.length); })();
      m.ror = this.stats.lifetimeHands >= 100 ? this.stats.riskOfRuin(2000) * 100 : 100;
      m.vpip = (hs => hs && hs.hands ? 100 * (hs.vpip || 0) / hs.hands : null)(this.oppModel.stats['Hero (You)']);
      m.realized = this.stats.sessionHands >= 3 ? 100 : null;

      // EV per action (for the action bar)
      const evCtx = { pot: g.pot, currentBet: g.currentBet, betInRound: hero.betInRound, board: g.board.length, bb: g.bb(), playerStack: hero.stack, oppStacks: oppsActive.map(pp => pp.stack) };
      const eqForEv = equity != null ? equity : 0;
      const evCall = PA.heroActionEV(evCtx, 'c', eqForEv, 0);
      const evRaise = PA.heroActionEV(evCtx, 'r', eqForEv, Math.floor(g.pot * 0.66));

      const posLongMap = { BT: 'Button', SB: 'Small Blind', BB: 'Big Blind', UTG: 'UTG', CO: 'Cutoff', MP: 'Middle' };
      return {
        board: g.board.slice(), heroHand: hero.hand.slice(), street,
        pot: g.pot, equityPct, potOddsLabel, impliedLabel,
        posLong: posLongMap[g.positionOf(hs)] || g.positionOf(hs),
        outs, scare, commit, rangeMode: this.rangeMode, tab: this.tomTab,
        opponents, advice, potOddsHeader, metrics: m,
        evCheck: toCall === 0 ? 0 : evCall, evCall, evRaise,
      };
    }

    lastAggressorSeat() {
      if (!this.history) return -1;
      let seat = -1;
      for (const st of this.history.streets) for (const a of st.actions) if (a.action === 'raise') seat = a.seat;
      return seat;
    }

    // which seats' hole cards are face-up right now
    seatReveal(seat, active) {
      if (this.handResult) return true;                    // showdown: reveal ALL (incl. folded) for review
      if (this.godMode || this.spectating) return true;
      if (this.hotseat) return this.armed && seat === this.game.toAct && this.humanSeats.has(seat);
      // single-player: hero (seat 0) always; villains after hero folds
      const heroFolded = !this.game.players[0].active && this.game.handInProgress;
      return this.humanSeats.has(seat) || heroFolded;
    }

    // full game-state snapshot for the view
    snapshot() {
      const g = this.game, hs = this.heroSeat();
      // Once the (single-player) hero folds (or god mode), reveal villains + tells.
      const heroFolded = !this.hotseat && !g.players[0].active && g.handInProgress;
      const revealVillains = this.godMode || heroFolded;
      const showTellsEff = this.showTells || heroFolded;
      const armedHuman = this.humanToAct() && (!this.hotseat || this.armed);
      return {
        players: g.players.map(p => ({
          seat: p.seat, name: p.name, style: p.style, stack: p.stack,
          bet: p.betInRound, active: p.active, allIn: p.allIn,
          isHuman: p.isHuman, hand: p.hand.slice(), lastAction: p.lastAction,
          reveal: this.seatReveal(p.seat, p.active),
          isActiveSeat: this.hotseat ? (g.toAct === p.seat && this.humanSeats.has(p.seat)) : p.isHuman,
          pos: g.positionOf(p.seat),
          isDealer: p.seat === g.dealerIdx, isTurn: g.toAct === p.seat,
          leak: (showTellsEff && !p.isHuman) ? this.oppModel.biggestLeak(p.name) : null,
          level: (showTellsEff && !p.isHuman) ? this.oppModel.levelOf(p.name) : null,
          range: (showTellsEff && !p.isHuman && p.active)
            ? PA.rangeFor(p.style, this.streetName()) : null,
        })),
        board: g.board.slice(),
        pot: g.pot, street: this.streetName(),
        handNumber: g.handNumber, sb: g.sb(), bb: g.bb(),
        hotseat: this.hotseat, passGate: this.passGate,
        activeName: g.players[g.toAct] ? g.players[g.toAct].name : '',
        spectating: this.spectating,
        spectator: this.spectating ? this.spectatorData() : null,
        assists: this.assistFlags(),
        canUseGod: this.canUseGod(),
        awaitingHero: armedHuman,
        legal: armedHuman ? g.legalActions(g.toAct) : null,
        advisor: armedHuman ? this.advisor() : null,
        events: this.events.slice(),
        handResult: this.handResult,
        revealVillains, heroFolded,
        training: this.training,
        tom: this.training ? this.tomData() : null,
        godMode: this.godMode, showTells: this.showTells,
        session: {
          hands: this.stats.sessionHands, bb100: this.stats.sessionBbPer100,
          std: this.stats.sessionStd, lifeHands: this.stats.lifetimeHands,
          lifeBb100: this.stats.lifetimeBbPer100,
        },
      };
    }

    render() { this.onRender(this.snapshot()); }
  }

  // ---------------- View (DOM) ----------------
  const SUIT_GLYPH = { c: '♣', d: '♦', h: '♥', s: '♠' };
  const SUIT_CLASS = { c: 'club', d: 'diamond', h: 'heart', s: 'spade' };

  function cardHTML(cardInt, hidden) {
    if (hidden) return '<span class="card back"></span>';
    const str = E.cardToStr(cardInt);
    const r = str[0], s = str[1];
    return `<span class="card ${SUIT_CLASS[s]}"><b>${r === 'T' ? '10' : r}</b><i>${SUIT_GLYPH[s]}</i></span>`;
  }

  class View {
    constructor(rootEl, controller) {
      this.root = rootEl;
      this.ctrl = controller;
      this.build();
    }
    build() {
      this.root.innerHTML = `
        <div class="piq-top">
          <div class="piq-brand">Poker<b>IQ</b></div>
          <div class="piq-hud">
            <span id="piq-hand">Hand —</span>
            <span id="piq-blinds">Blinds —</span>
            <span id="piq-session" class="muted"></span>
          </div>
          <div class="piq-menu">
            <label class="train-toggle" id="piq-train"><span class="tt-knob"></span><span class="tt-lab">Training</span></label>
            <button data-act="players" class="ghost">Players</button>
            <button data-act="tells" class="ghost">Tells</button>
            <button data-act="god" class="ghost">God</button>
            <button data-act="trainers" class="ghost">Trainers ▾</button>
            <button data-act="stats" class="ghost">Stats</button>
            <button data-act="savelog" class="ghost" title="Download the full session log (PyQt-format) for AI analysis">⤓ Log</button>
            <button data-act="help" class="ghost">?</button>
          </div>
        </div>
        <div class="table-view" id="piq-tableview">
          <div class="piq-felt">
            <div class="piq-board" id="piq-board"></div>
            <div class="piq-pot" id="piq-pot"></div>
            <div class="piq-seats" id="piq-seats"></div>
            <div class="piq-result" id="piq-result" style="display:none"></div>
          </div>
          <div class="piq-bottom">
            <div class="piq-feed" id="piq-feed"></div>
            <div class="piq-advisor" id="piq-advisor"></div>
          </div>
        </div>
        <div class="tom-view" id="piq-tomview" style="display:none"></div>
        <div class="piq-spectator" id="piq-spectator" style="display:none"></div>
        <div class="piq-gate" id="piq-gate" style="display:none"></div>
        <div class="piq-footer"><div class="piq-actions" id="piq-actions"></div></div>
        <div class="piq-modal" id="piq-modal" style="display:none"></div>`;
      this.el = {
        hand: this.root.querySelector('#piq-hand'),
        blinds: this.root.querySelector('#piq-blinds'),
        session: this.root.querySelector('#piq-session'),
        board: this.root.querySelector('#piq-board'),
        pot: this.root.querySelector('#piq-pot'),
        seats: this.root.querySelector('#piq-seats'),
        result: this.root.querySelector('#piq-result'),
        feed: this.root.querySelector('#piq-feed'),
        advisor: this.root.querySelector('#piq-advisor'),
        actions: this.root.querySelector('#piq-actions'),
        modal: this.root.querySelector('#piq-modal'),
        tableView: this.root.querySelector('#piq-tableview'),
        tomView: this.root.querySelector('#piq-tomview'),
        gate: this.root.querySelector('#piq-gate'),
        spectator: this.root.querySelector('#piq-spectator'),
        train: this.root.querySelector('#piq-train'),
      };
      this.root.querySelector('.piq-menu').addEventListener('click', e => {
        const act = e.target.getAttribute('data-act'); if (!act) return;
        if (act === 'god') { this.ctrl.toggleGod(); }
        else if (act === 'tells') { this.ctrl.toggleTells(); }
        else if (this.onMenu) this.onMenu(act);
      });
      this.el.train.addEventListener('click', () => { this.ctrl.toggleTraining(); });
      // delegated clicks inside the ToM view (tabs + range-mode radio)
      this.el.tomView.addEventListener('click', e => {
        const tab = e.target.closest('[data-tab]'); if (tab) { this.ctrl.tomTab = tab.getAttribute('data-tab'); this.ctrl.render(); return; }
        const rm = e.target.closest('[data-mode]'); if (rm) { this.ctrl.rangeMode = rm.getAttribute('data-mode'); this.ctrl.render(); return; }
      });
    }

    render(s) {
      this.el.hand.textContent = `Hand #${s.handNumber} · ${s.street}`;
      this.el.blinds.textContent = `Blinds $${s.sb}/$${s.bb}`;
      this.el.session.textContent = `Session ${s.session.hands}h · ${s.session.bb100 >= 0 ? '+' : ''}${s.session.bb100.toFixed(1)} bb/100`;
      this.el.train.classList.toggle('on', s.training);

      // hotseat privacy gate covers everything until the next player arms
      if (s.passGate) {
        this.el.gate.style.display = 'flex';
        this.el.gate.innerHTML = `<div class="gate-card">
          <div class="gate-icon">🂠</div>
          <div class="gate-pass">Pass the device to</div>
          <div class="gate-name">${escapeHTML(s.activeName)}</div>
          <div class="gate-sub">Everyone else: look away.</div>
          <button class="btn check gate-go" id="piq-arm">I'm ${escapeHTML(s.activeName)} — show my cards</button>
        </div>`;
        const arm = this.root.querySelector('#piq-arm');
        if (arm) arm.onclick = () => this.ctrl.arm();
      } else {
        this.el.gate.style.display = 'none';
      }

      // spectator (you folded) panel — overlays the bottom with the equity table
      if (s.spectating && s.spectator) {
        this.el.spectator.style.display = 'block';
        this.renderSpectator(s);
      } else {
        this.el.spectator.style.display = 'none';
      }

      if (s.training) {
        this.el.tableView.style.display = 'none';
        this.el.tomView.style.display = s.passGate ? 'none' : 'block';
        if (!s.passGate) this.el.tomView.innerHTML = getToM().render(s.tom);
      } else {
        this.el.tomView.style.display = 'none';
        this.el.tableView.style.display = 'flex';
        // board
        this.el.board.innerHTML = s.board.map(c => cardHTML(c, false)).join('') ||
          '<span class="muted">— preflop —</span>';
        this.el.pot.innerHTML = `<span class="chip"></span> Pot $${s.pot}`;
        this.el.seats.innerHTML = s.players.map(p => this.seatHTML(p, s)).join('');
        this.el.feed.innerHTML = s.events.map(e => `<div>${escapeHTML(e)}</div>`).join('');
        this.el.advisor.innerHTML = s.advisor ? this.advisorHTML(s.advisor) : '';
      }

      // shared action footer (with EV labels in training mode)
      this.el.actions.innerHTML = '';
      if (s.handResult) this.buildEndActions(s);
      else if (s.spectating) this.el.actions.innerHTML = '<span class="muted">👁 You folded — watching with God view. Use the panel to review streets.</span>';
      else if (s.passGate) this.el.actions.innerHTML = `<span class="muted">🂠 waiting for ${escapeHTML(s.activeName)} to take the device…</span>`;
      else if (s.awaitingHero && s.legal) this.buildActions(s.legal, s.training ? s.tom : null);
      else this.el.actions.innerHTML = '<span class="muted">…bots acting</span>';

      // result overlay only in table mode
      if (s.handResult && !s.training) this.showResult(s.handResult, s);
      else this.el.result.style.display = 'none';

      const godBtn = this.root.querySelector('[data-act="god"]');
      godBtn.classList.toggle('on', s.godMode);
      // God peek is disabled while other humans are at the table (hotseat) —
      // you only get the God view after you fold.
      godBtn.disabled = !s.canUseGod;
      godBtn.title = s.canUseGod ? '' : 'God peek is off in multiplayer — you get the God view after you fold';
      this.root.querySelector('[data-act="tells"]').classList.toggle('on', s.showTells);
    }

    // spectator equity panel (you folded → God view), mirrors the desktop layout
    renderSpectator(s) {
      const sp = s.spectator;
      const bar = (frac, cls) => `<div class="sb-track"><div class="sb-fill ${cls}" style="width:${Math.max(0, Math.min(1, frac || 0)) * 100}%"></div></div>`;
      const rows = sp.table.map(p => {
        if (p.folded) return `<tr class="folded"><td>${escapeHTML(p.name)}</td><td colspan="4" class="muted">(Folded)</td></tr>`;
        const ev = p.facing ? (p.evPos ? '<span class="pos">+EV</span>' : '<span class="neg">-EV</span>') : '';
        return `<tr>
          <td class="${p.seat === 0 ? 'me' : ''}">${escapeHTML(p.name)}</td>
          <td>${bar(p.real, 'real')}<span class="sb-pct">${(p.real * 100).toFixed(0)}%</span></td>
          <td>${bar(p.thinking, 'think')}<span class="sb-pct">${(p.thinking * 100).toFixed(0)}%</span></td>
          <td>${bar(p.potOdds, 'odds')}<span class="sb-pct">${(p.potOdds * 100).toFixed(0)}%</span></td>
          <td class="sb-ev">${ev}</td>
        </tr>`;
      }).join('');
      const board = sp.board.length ? sp.board.map(c => cardHTML(c, false)).join('') : '<span class="muted">preflop</span>';
      this.el.spectator.innerHTML = `
        <div class="sp-head">
          <span class="sp-title">👁 Spectating — ${escapeHTML(sp.street)}${sp.live ? '' : ' (review)'}</span>
          <span class="sp-board">${board}</span>
          <span class="sp-pot">Pot $${sp.pot}</span>
          <span class="sp-nav">
            <button class="ghost" id="sp-prev" ${sp.canPrev ? '' : 'disabled'}>◄ Previous Street</button>
            <button class="ghost" id="sp-next" ${sp.canNext ? '' : 'disabled'}>Next Street ►</button>
            <button class="btn ${sp.passMode ? 'check' : 'fold'}" id="sp-close">${sp.passMode ? 'Pass device →' : 'Close View'}</button>
          </span>
        </div>
        <table class="sp-table">
          <tr><th>Player</th><th>Real</th><th>Thinking</th><th>Pot Odds</th><th></th></tr>

        </table>`;
      const prev = this.root.querySelector('#sp-prev'); if (prev) prev.onclick = () => this.ctrl.specPrev();
      const next = this.root.querySelector('#sp-next'); if (next) next.onclick = () => this.ctrl.specNext();
      const close = this.root.querySelector('#sp-close'); if (close) close.onclick = () => this.ctrl.exitSpectator(sp.passMode);
    }

    buildEndActions(s) {
      const wrap = this.el.actions;
      const lbl = document.createElement('span');
      if (s.hotseat) {
        const winners = s.handResult.net.filter(n => s.handResult.payouts[n.seat] > 0);
        lbl.className = 'end-net pos';
        lbl.textContent = `Hand #${s.handNumber}: ${winners.map(w => `${w.name} +$${w.net}`).join(', ') || 'split'}`;
      } else {
        const heroNet = (s.handResult.net.find(n => n.seat === 0) || { net: 0 }).net;
        lbl.className = 'end-net ' + (heroNet >= 0 ? 'pos' : 'neg');
        lbl.textContent = `Hand #${s.handNumber}: you ${heroNet >= 0 ? 'win' : 'lose'} $${Math.abs(heroNet)}`;
      }
      const sum = document.createElement('button'); sum.className = 'btn summary'; sum.textContent = 'Hand summary';
      sum.onclick = () => this.showHandSummary(this.ctrl.lastHistory);
      const next = document.createElement('button'); next.className = 'btn next'; next.textContent = 'Next hand →';
      next.onclick = () => this.ctrl.newHand();
      wrap.append(lbl, sum, next);

/*
 * PokerIQ — boot + wiring. Creates the Controller + View, hooks the top-menu
 * to the trainer registry / stats panel, and provides honest in-browser
 * notices for the two features that cannot run in a sandboxed single file:
 * LAN multiplayer (raw TCP sockets) and Claude hand-analysis (CLI subprocess).

(function (root) {
  'use strict';
  const PokerUI = root.PokerUI, PT = root.PokerTrainers, PA = root.PokerAnalytics;

  function boot(mountId) {
    const mount = document.getElementById(mountId || 'app');
    const ctrl = new PokerUI.Controller({
      botDelayMs: 600,
      onRender: (snap) => view.render(snap),

    const view = new PokerUI.View(mount, ctrl);

    // trainer modal launcher
    function openTrainer(key) {
      const entry = PT.REGISTRY[key]; if (!entry) return;
      const ctx = {
        rng: Math.random,
        stats: ctrl.stats,
        predictions: [],                      // calibration: none logged yet
        actionHistory: ctrl.events.slice(),   // range narrowing uses last hand's log
        close: () => view.closeModal(),

      view.showModal(entry.build(ctx));
    }

    // stats panel (session + lifetime snapshot)
    function openStats() {
      const s = ctrl.stats;
      const card = document.createElement('div'); card.className = 'modal-card';
      const [lo, hi] = s.edgeConfidenceInterval();
      card.innerHTML = `
        <h2>Session statistics</h2>
        <div class="sub">Live session + persistent lifetime numbers (localStorage).</div>
        <div class="kv">
          <div class="k">Session hands</div><div>${s.sessionHands}</div>
          <div class="k">Session bb/100</div><div>${s.sessionBbPer100 >= 0 ? '+' : ''}${s.sessionBbPer100.toFixed(1)}</div>

          <div class="k">Lifetime profit</div><div>$${s.lifetimeProfit.toFixed(0)}</div>
          <div class="k">Lifetime bb/100</div><div>${s.lifetimeBbPer100 >= 0 ? '+' : ''}${s.lifetimeBbPer100.toFixed(1)}</div>
          <div class="k">Edge 95% CI</div><div>[${lo.toFixed(1)}, ${hi.toFixed(1)}] bb/100</div>
        </div>
        <div class="modal-actions"></div>`;
      const close = document.createElement('button'); close.className = 'ghost'; close.textContent = 'Close';
      close.onclick = () => view.closeModal();
      card.querySelector('.modal-actions').appendChild(close);
      view.showModal(card);
    }

    // honest notice for dropped features
    function droppedNotice(title, body) {
